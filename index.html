<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミ★ Dom P ★彡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#ffffe4;
    --cream-deep:#a5d5e7;
    --sun:#79c4db;
    --sun-deep:#52b1d6;
    --coral:#6cd1eb;
    --coral-deep:#42b3e8;
    --sky:#7fb2d4;
    --leaf:#e7d673;
    --choc:#4A3524;
    --choc-soft:#7A5C48;
    --paper:#FFFDF6;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--choc);
    font-family:'Quicksand',sans-serif;
    overflow-x:hidden;
  }
  h1,h2,.script{
    font-family:'Caveat',cursive;
    font-weight:700;
  }
  .note-text{font-family:'Kalam',cursive;}

  a:focus-visible, button:focus-visible, .flame:focus-visible{
    outline:3px solid var(--choc);
    outline-offset:3px;
  }

  /* ---------- BUNTING ---------- */
  .bunting{
    position:relative;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-evenly;
    align-items:flex-start;
    padding-top:14px;
    opacity:.85;
  }
  .flag{
    width:34px;
    height:44px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform:rotate(0deg);
  }
  .flag:nth-child(6n+1){background:var(--coral); transform:rotate(-4deg);}
  .flag:nth-child(6n+2){background:var(--sky); transform:rotate(3deg);}
  .flag:nth-child(6n+3){background:var(--sun); transform:rotate(-2deg);}
  .flag:nth-child(6n+4){background:var(--leaf); transform:rotate(4deg);}
  .flag:nth-child(6n+5){background:var(--coral-deep); transform:rotate(-3deg);}
  .flag:nth-child(6n+6){background:var(--sun-deep); transform:rotate(2deg);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    min-height:90vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 24px 100px;
    background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);
  }
  .sunburst{
    position:absolute;
    top:-60px;
    right:-60px;
    width:260px;
    height:260px;
    opacity:.9;
  }
  h1.title{
    font-size:clamp(3rem,9vw,6.2rem);
    line-height:1;
    margin:0 0 10px;
    color:var(--choc);
  }
  h1.title .accent{color:var(--coral-deep);}
  .subtitle{
    font-size:clamp(1.05rem,2.2vw,1.35rem);
    max-width:480px;
    color:var(--choc-soft);
    margin:0 auto 30px;
  }

  .balloons{
    position:relative;
    width:80%;
    max-width:420px;
    height:120px;
    margin-top:10px;
  }
  .balloon{
    position:absolute;
    bottom:0;
    width:64px;
    height:78px;
    border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  }
  .balloon::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    width:2px;
    height:36px;
    background:var(--choc-soft);
    transform:translateX(-50%);
  }
  .balloon.b1{left:6%;  background:var(--coral); transform:rotate(-4deg);}
  .balloon.b2{left:38%; background:var(--sky); height:92px; width:74px; transform:rotate(2deg);}
  .balloon.b3{left:70%; background:var(--sun); transform:rotate(-3deg);}

  .scroll-cue{
    margin-top:34px;
    font-family:'Kalam',cursive;
    color:var(--choc-soft);
    font-size:.95rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .scallop-divider{
    display:block;
    width:100%;
    height:46px;
    margin-top:-2px;
  }

  /* ---------- SECTION SHELL ---------- */
  section{padding:70px 20px 90px;}
  .section-head{
    text-align:center;
    max-width:600px;
    margin:0 auto 46px;
  }
  .section-head h2{
    font-size:clamp(2.4rem,5vw,3.4rem);
    margin:0 0 8px;
    color:var(--choc);
  }
  .section-head p{
    color:var(--choc-soft);
    margin:0;
    font-size:1.05rem;
  }

  /* ---------- GALLERY ---------- */
  .gallery-wrap{background:var(--cream-deep);}
  .gallery{
    max-width:100%;
    margin:0 auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px 10px 10px;
  }
  .photo-item{
    position:relative;
    width:min(28vw, 23%);
    aspect-ratio:1/1;
    margin:-10px -36px 30px;
    border:8px dashed var(--paper);
    box-shadow:0 10px 20px -10px rgba(74,53,36,.45);
    cursor:pointer;
    background:none;
    padding:0;
    transition:transform .2s ease, z-index 0s;
  }
  .photo-item:hover, .photo-item:focus-visible{
    transform:scale(1.06) rotate(0deg) !important;
    z-index:20 !important;
  }
  .photo-item img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:var(--cream-deep);
  }
  .photo-item:nth-child(6n+1){transform:rotate(-7deg) translateY(10px); z-index:1;}
  .photo-item:nth-child(6n+2){transform:rotate(4deg) translateY(-14px); z-index:2;}
  .photo-item:nth-child(6n+3){transform:rotate(-3deg) translateY(20px); z-index:3;}
  .photo-item:nth-child(6n+4){transform:rotate(8deg) translateY(-6px); z-index:2;}
  .photo-item:nth-child(6n+5){transform:rotate(-6deg) translateY(16px); z-index:1;}
  .photo-item:nth-child(6n+6){transform:rotate(5deg) translateY(-10px); z-index:3;}
  .photo-item.missing img{opacity:0;}
  .photo-item.missing::after{
    content:attr(data-hint);
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:14px;
    font-family:'Kalam',cursive;
    font-size:.95rem;
    color:var(--choc-soft);
    background:repeating-linear-gradient(45deg, var(--cream) 0 10px, var(--cream-deep) 10px 20px);
  }

  .lightbox{
    position:fixed;inset:0;
    background:rgba(74,53,36,.78);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    background:var(--paper);
    padding:14px 14px 20px;
    max-width:min(520px,90vw);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
  }
  .lightbox-inner img{
    display:block;
    width:100%;
    max-height:70vh;
    object-fit:contain;
    background:var(--cream-deep);
  }
  .lightbox-close{
    display:block;
    margin:14px auto 0;
    background:var(--coral);
    color:var(--paper);
    border:none;
    padding:8px 22px;
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- WISHES ---------- */
  #WishSection{
        background:repeating-linear-gradient(45deg, var(--cream) 0 20px, #e7c46c 20px 30px);
  }
  .stack{
    position:relative;
    width:min(480px, 88vw);
    height:min(650px, 119vw);
    margin:0 auto 26px;
  }
  .stack-item{
    position:absolute;
    inset:0;
    border:10px solid var(--paper);
    box-shadow:0 12px 26px -12px rgba(74,53,36,.5);
    cursor:pointer;
    background:none;
    padding:0;
    transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s ease;
  }
  .stack-item img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:var(--cream-deep);
  }
  .stack-item.missing img{opacity:0;}
  .stack-item.missing::after{
    content:attr(data-hint);
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:18px;
    font-family:'Kalam',cursive;
    font-size:1rem;
    color:var(--choc-soft);
    background:repeating-linear-gradient(45deg, var(--cream) 0 10px, var(--cream-deep) 10px 20px);
  }
  .stack-item.flying{
    transform:translateY(60px) rotate(24deg) !important;
    opacity:0;
  }
  .stack-hint{
    font-family:'Kalam',cursive;
    color:var(--choc-soft);
    text-align:center;
    margin:0;
  }

  /* ---------- CAKE / CANDLES ---------- */
  .cake-wrap{
    background:linear-gradient(180deg,#e7c46c 0%, #FFE9BE 100%);
    text-align:center;
  }
 
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:.9; }
  }

  footer{
    text-align:center;
    padding:36px 20px 50px;
    font-family:'Kalam',cursive;
    color:var(--choc-soft);
    background:linear-gradient(180deg,#FFE9BE 0%, var(--sun) 120%);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-iteration-count:1 !important;}
    html{scroll-behavior:auto;}
  }

  @media (max-width:520px){
    .photo-item{width:150px; margin:-6px -22px 22px;}
    .stack{width:230px; height:290px;}
  }

  .fala{
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 105%;
    max-width: 105%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* ---------- SECRET CODE ---------- */
  .secret-wrap{
    text-align:center;
    padding:50px 20px 70px;
    background:var(--cream);
  }
  .secret-wrap p{
    font-family:'Kalam',cursive;
    color:var(--choc-soft);
    margin:0 0 16px;
  }
  .secret-btn{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    background:var(--paper);
    border:2px dashed var(--choc-soft);
    color:var(--choc);
    padding:14px 30px;
    border-radius:40px;
    cursor:pointer;
    font-size:1rem;
    transition:background .2s ease, transform .2s ease;
  }
  .secret-btn:hover{background:var(--sun); transform:translateY(-2px);}

  .secret-overlay{
    position:fixed; inset:0;
    background:rgba(74,53,36,.6);
    display:none;
    align-items:center; justify-content:center;
    z-index:70;
    padding:20px;
  }
  .secret-overlay.open{display:flex;}
  .secret-box{
    padding:30px 26px;
    max-width:340px;
    width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
    text-align:center;
    background:repeating-linear-gradient(45deg, var(--cream) 0 10px, var(--cream-deep) 10px 20px);
  }
  .secret-box p{
    font-family:'Kalam',cursive;
    font-size:1.1rem;
    color:var(--choc);
    margin:0 0 14px;
  }
  .secret-input{
    width:100%;
    padding:11px 12px;
    font-family:'Quicksand',sans-serif;
    font-size:1.05rem;
    border:2px solid var(--choc-soft);
    border-radius:8px;
    margin-bottom:14px;
    text-align:center;
    box-sizing:border-box;
    background:var(--cream);
    color:var(--choc);
  }
  .secret-input.shake{animation:secretShake .4s;}
  @keyframes secretShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .secret-actions{display:flex; gap:10px; justify-content:center;}
  .secret-submit{
    background:var(--coral-deep);
    color:var(--paper);
    border:none;
    padding:10px 22px;
    border-radius:20px;
    font-weight:700;
    cursor:pointer;
    font-family:'Quicksand',sans-serif;
  }
  .secret-cancel{
    background:none;
    border:none;
    color:var(--choc-soft);
    cursor:pointer;
    text-decoration:underline;
    font-family:'Quicksand',sans-serif;
  }
  .secret-error{
    color:#c0392b;
    font-family:'Kalam',cursive;
    margin-top:12px;
    display:none;
  }
  .secret-error.show{display:block;}

  .secret-note-overlay{
    position:fixed; inset:0;
    background:rgba(74,53,36,.68);
    display:none;
    align-items:center; justify-content:center;
    z-index:71;
    padding:20px;
  }
  .secret-note-overlay.open{display:flex;}
  .secret-note-box{
    position:relative;
    background:var(--paper);
    padding:36px 30px;
    max-width:440px;
    width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
    border:3px dashed var(--sun-deep);
  }
  .secret-note-box p{
    font-family:'Kalam',cursive;
    font-size:0.9rem;
    line-height:1.6;
    color:var(--choc);
    margin:0;
    white-space:pre-line;
  }
  .secret-note-close{
    position:absolute;
    top:8px; right:10px;
    background:none;
    border:none;
    font-size:1.3rem;
    line-height:1;
    color:var(--choc-soft);
    cursor:pointer;
    padding:6px;
  }
</style>
</head>
<body>

<!-- ============ HERO ============ -->
<section class="hero">
  <h1 class="title" style="margin-top: -20%;"><i style="margin-left: -15%;">Sto lat</i>,<br><span class="accent">ミ★ Dom P! ★彡</span></h1>
  <p class="subtitle">Kilka słów i wspomnień o Tobie, za które Cię uwielbiamy!</p>

  <div class="balloons" aria-hidden="true">
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>

<!-- ============ GALLERY ============ -->
<div class="gallery-wrap" style="background-color: #e7c46c;">
<section>
  <div class="section-head">

</div>

<!-- ============ WISHES ============ -->
<section id="WishSection">
  <div class="section-head">
    <h2>Życzenia</h2>
    <p>Od ludzi, którzy Cię znają najlepiej!</p>
  </div>
  <div class="stack" id="wishStack">
    <button class="stack-item">
      <img src="wishes/zyczenie-1.png" alt="Życzenie 1" onerror="this.closest('.stack-item').classList.add('missing')">
    </button>
    <button class="stack-item">
      <img src="wishes/zyczenie-2.png" alt="Życzenie 2" onerror="this.closest('.stack-item').classList.add('missing')">
    </button>
    <button class="stack-item">
      <img src="wishes/zyczenie-3.png" alt="Życzenie 3" onerror="this.closest('.stack-item').classList.add('missing')">
    </button>
    <button class="stack-item">
      <img src="wishes/zyczenie-4.png" alt="Życzenie 4" onerror="this.closest('.stack-item').classList.add('missing')">
    </button>
    <button class="stack-item">
      <img src="wishes/zyczenie-5.png" alt="Życzenie 5" onerror="this.closest('.stack-item').classList.add('missing')">
    </button>

<section class="cake-wrap">
</section>

<footer>
  <p>Wszystkiego najlepszego Dom P!</p>
    <button class="secret-btn" id="secretBtn">?</button>
</footer>

<div class="secret-overlay" id="secretOverlay">
  <div class="secret-box">
    <p>Podaj kod</p>
    <input type="text" id="secretInput" class="secret-input" autocomplete="off" placeholder="kod">

      <button class="secret-submit" id="secretSubmit">Sprawdź</button>

</div>

  <div class="secret-note-box">
    <button class="secret-note-close" id="secretNoteClose" aria-label="Zamknij">✕</button>

    <p id="NotatkaText"></p>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <img id="lightboxPhoto" src="" alt="">
    <button id="lightboxClose" style="visibility: hidden;"></button>
  </div>
</div>

<script>
  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxPhoto = document.getElementById('lightboxPhoto');

  gallery.querySelectorAll('.photo-item').forEach(card => {
    card.addEventListener('click', () => {
      if(card.classList.contains('missing')) return;
      const img = card.querySelector('img');
      lightboxPhoto.src = img.src;
      lightboxPhoto.alt = img.alt;
      lightbox.classList.add('open');
    });
  });
  document.getElementById('lightboxClose').addEventListener('click', () => {
    lightbox.classList.remove('open');
  });
  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) lightbox.classList.remove('open');
  });

  const stack = document.getElementById('wishStack');
  let stackOrder = Array.from(stack.querySelectorAll('.stack-item'));

  function layoutStack(){
    stackOrder.forEach((item, i) => {
      const fromTop = stackOrder.length - 1 - i; 
      item.style.zIndex = i + 1;
      item.style.transform = `rotate(${(fromTop % 2 === 0 ? -1 : 1) * (2 + fromTop * 1.5)}deg) translateY(${fromTop * -3}px)`;
      item.style.pointerEvents = fromTop === 0 ? 'auto' : 'none';
    });
  }
  layoutStack();

  stack.addEventListener('click', (e) => {
    const top = stackOrder[stackOrder.length - 1];
    if(!top.contains(e.target) && e.target !== top) return;
    top.classList.add('flying');
    setTimeout(() => {
      top.classList.remove('flying');
      stackOrder.unshift(stackOrder.pop());
      layoutStack();
    }, 450);
  });


  const confettiColors = ['#FF7A5C','#FFC94A','#6FC3DF','#8FBF5A','#E85F42'];
  function burstConfetti(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const count = reduceMotion ? 0 : 60;
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100 + 'vw';
      piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      piece.style.animationDuration = (2.6 + Math.random()*1.8) + 's';
      piece.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
      document.body.appendChild(piece);
      piece.addEventListener('animationend', () => piece.remove());
    }
  }

  const SECRET_CODE = "2308.";
  const Notatka = "Hej, na początku strona miała przyjąć inny format, jednak jest wiele ludzi którzy chcieli wyrazić słowa wdzięczności i złożyć tobie życzenia urodzinowe dlatego stworzyła się z tego taka mini gablotka wspomnień z tobą za które bardzo dziękujemy i których mam nadzieje że będzie przybywać z dnia na dzień 😜 Bo każde to wspomnienie, to nie tylko mile spędzony czas, ale też świadomość i wdzięczność za to że mamy możliwość poznawać i spędzać czas z tak cudowną osobą jaką jesteś Ty. Chciałbym złożyć tobie życzenia prosto z serduszka, które jak co roku wspominając, życze tobie każdego dnia. Przede wszystkim życze tobie by w każdym dniu (i nocy) twojego życia, towarzyszyło tobie ogromne szczęście, nadzieja, poczucie miłości od najbliższych osób, świadomość jak cudowną osobą jesteś i jak wiele cudu wnosisz swoim ogromnym światłem. Dziękuje za każdą twoją obecność i możliwość spędzenia tego cudownego wydarzenia razem z tobą. Te wspomnienia nigdy nie znikną, a jeżeli zechcesz to i ta strona, rozbudowywując ją o nowe wspolnie spędzone chwile. Bo wierze że będzie ich ogrom 😜"

  const secretBtn = document.getElementById('secretBtn');
  const secretOverlay = document.getElementById('secretOverlay');
  const secretInput = document.getElementById('secretInput');
  const secretSubmit = document.getElementById('secretSubmit');
  const secretNoteOverlay = document.getElementById('secretNoteOverlay');
  const secretNoteClose = document.getElementById('secretNoteClose');
  const secretNoteText = document.getElementById('NotatkaText');

  function openSecret(){
    secretOverlay.classList.add('open');
    secretInput.value = '';
    setTimeout(() => secretInput.focus(), 50);
  }
  function closeSecret(){
    secretOverlay.classList.remove('open');
  }
  secretBtn.addEventListener('click', openSecret);
  secretOverlay.addEventListener('click', (e) => { if(e.target === secretOverlay) closeSecret(); });

  function checkSecretCode(){
    const value = secretInput.value.trim().toUpperCase();
    if(value.length && value === SECRET_CODE.toUpperCase()){
      closeSecret();
      secretNoteOverlay.classList.add('open');
      secretNoteText.innerText = Notatka;
    } else {
      secretInput.classList.remove('shake');
      void secretInput.offsetWidth;
      secretInput.classList.add('shake');
    }
  }
  secretSubmit.addEventListener('click', checkSecretCode);
  secretInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkSecretCode(); });

  secretNoteClose.addEventListener('click', () => secretNoteOverlay.classList.remove('open'));
  secretNoteOverlay.addEventListener('click', (e) => { if(e.target === secretNoteOverlay) secretNoteOverlay.classList.remove('open'); });
</script>

</body>
</html>
